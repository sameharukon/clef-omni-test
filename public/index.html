<!doctype html>
<html lang="ja">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Clef-omni Voice Lane</title>
	<link rel="stylesheet" href="style.css" />
</head>
<body>
	<header>
		<h1>Clef-omni Voice Lane</h1>
		<p class="sub">マイクに向かって「右」「左」と話すと車がレーンを移動します（←/→ キーでも操作可）</p>
	</header>

	<main>
		<section class="game">
			<canvas id="game" width="300" height="480" aria-label="3レーンの車ゲーム"></canvas>
			<div class="hud">
				<span>スコア <strong id="score">0</strong></span>
				<span id="gameState">停止中</span>
			</div>
			<div class="buttons">
				<button id="micBtn" type="button">マイク開始</button>
				<button id="gameBtn" type="button">ゲーム開始</button>
			</div>
		</section>

		<section class="panel">
			<h2>音声入力</h2>
			<div class="meter"><div id="level"></div><div id="thresholdMark"></div></div>
			<label>発話検出しきい値 <input id="threshold" type="range" min="0.005" max="0.2" step="0.005" value="0.03" />
				<output id="thresholdValue">0.030</output></label>
			<label>判定方式
				<select id="mode">
					<option value="left" selected>左かどうか（左でなければ右）</option>
					<option value="choice">3 択（右 / 左 / なし）</option>
				</select></label>
			<div id="leftOnly">
				<label>左と判定する確率 <input id="leftThreshold" type="range" min="0.05" max="0.95" step="0.05" value="0.5" />
					<output id="leftThresholdValue">0.50</output></label>
			</div>
			<div id="choiceOnly">
				<label>判定の最低信頼度 <input id="minConf" type="range" min="0" max="1" step="0.05" value="0.5" />
					<output id="minConfValue">0.50</output></label>
				<label>信頼度不足のときの再送
					<select id="retries">
						<option value="0">しない</option>
						<option value="1">1 回（38ms ずらす）</option>
						<option value="2" selected>2 回（38 / 19ms ずらす、並列）</option>
						<option value="3">3 回（38 / 19 / 58ms ずらす、並列）</option>
					</select></label>
			</div>
			<label>結果を反映する最大遅延 <input id="maxDelay" type="range" min="300" max="3000" step="100" value="1000" />
				<output id="maxDelayValue">1000ms</output></label>
			<label><input id="normalize" type="checkbox" checked /> 送信前に音量を正規化する</label>
			<p id="vadState" class="vad">待機中</p>

			<h2>正解率</h2>
			<p class="hint">各行の「正解」で実際に話した内容を選ぶと集計されます（「他」は右・左以外の発話や雑音）。</p>
			<div id="summary" class="summary">正解ラベル付きの判定はまだありません</div>
			<div class="log-actions">
				<button id="copyBtn" type="button">ログをコピー</button>
				<button id="csvBtn" type="button">CSV ダウンロード</button>
				<button id="clearBtn" type="button">ログを消去</button>
			</div>

			<h2>判定ログ</h2>
			<div class="table-wrap">
				<table>
					<thead><tr><th>時刻</th><th>判定</th><th>信頼度</th><th>長さ</th><th>遅延</th><th>トークン / Neurons</th><th>正解</th></tr></thead>
					<tbody id="log"></tbody>
				</table>
			</div>
			<details id="rawDetails">
				<summary>選択中のレスポンス (raw) — 行をクリックで切り替え</summary>
				<pre id="raw">-</pre>
			</details>
		</section>
	</main>

	<script src="app.js" type="module"></script>
</body>
</html>
